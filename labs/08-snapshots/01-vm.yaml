apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: snap-vm
  namespace: snap-lab
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: snap-vm-root
      spec:
        source:
          registry:
            url: docker://quay.io/containerdisks/fedora:latest
        storage:
          resources:
            requests:
              storage: 10Gi
  template:
    metadata:
      labels:
        app: snap-vm
    spec:
      domain:
        cpu:
          cores: 1
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
        resources:
          requests:
            memory: 2Gi
      networks:
        - name: default
          pod: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: rootdisk
          dataVolume:
            name: snap-vm-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              user: cloud-user
              password: lab-pass-123
              chpasswd:
                expire: false
              ssh_pwauth: true
