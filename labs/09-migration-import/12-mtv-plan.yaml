# Plan + Migration. CHANGE the VM name or id (see the provider inventory).
apiVersion: forklift.konveyor.io/v1beta1
kind: Plan
metadata:
  name: ova-plan
  namespace: openshift-mtv
spec:
  provider:
    source:
      name: ova-provider
      namespace: openshift-mtv
    destination:
      name: host
      namespace: openshift-mtv
  targetNamespace: migrate-lab
  map:
    network:
      name: ova-netmap
      namespace: openshift-mtv
    storage:
      name: ova-storagemap
      namespace: openshift-mtv
  vms:
    - name: CHANGE-ME-vm-name
---
apiVersion: forklift.konveyor.io/v1beta1
kind: Migration
metadata:
  name: ova-migration
  namespace: openshift-mtv
spec:
  plan:
    name: ova-plan
    namespace: openshift-mtv
