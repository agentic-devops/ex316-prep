# External access for the imported VM: SSH via NodePort, HTTP via ClusterIP + Route.
apiVersion: v1
kind: Service
metadata:
  name: imported-ssh
  namespace: migrate-lab
spec:
  type: NodePort
  selector:
    app: imported-vm
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      nodePort: 30122
---
apiVersion: v1
kind: Service
metadata:
  name: imported-http
  namespace: migrate-lab
spec:
  type: ClusterIP
  selector:
    app: imported-vm
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: imported-http
  namespace: migrate-lab
spec:
  to:
    kind: Service
    name: imported-http
  port:
    targetPort: http
