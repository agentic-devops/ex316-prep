# NAD that connects VMs to bridge br-vm created by the NNCP.
# The resourceName annotation is required for bridge NADs on OpenShift Virtualization.
# Add "vlan": 100 to the JSON to tag traffic.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vm-br
  namespace: extnet-lab
  annotations:
    k8s.v1.cni.cncf.io/resourceName: bridge.network.kubevirt.io/br-vm
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "vm-br",
      "type": "cnv-bridge",
      "bridge": "br-vm",
      "ipam": {},
      "macspoofchk": true,
      "preserveDefaultVlan": false
    }
