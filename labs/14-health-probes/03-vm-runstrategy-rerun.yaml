# runStrategy RerunOnFailure: restart the VMI only if it failed; a clean guest shutdown stays off.
# Compare with Always (always restart) and Manual (user controls start/stop).
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: rerun-vm
  namespace: probes-lab
spec:
  runStrategy: RerunOnFailure
  template:
    metadata:
      labels:
        app: rerun-vm
    spec:
      domain:
        cpu:
          cores: 1
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
        resources:
          requests:
            memory: 2Gi
      networks:
        - name: default
          pod: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: rootdisk
          containerDisk:
            image: quay.io/containerdisks/fedora:latest
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              user: cloud-user
              password: lab-pass-123
              chpasswd:
                expire: false
              ssh_pwauth: true
