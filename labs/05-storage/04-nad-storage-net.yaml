# Secondary "storage network" for reaching an external NFS/iSCSI server from the guest.
# Uses bridge br-vm from lab 04 (NNCP must exist first).
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: storage-net
  namespace: storage-lab
  annotations:
    k8s.v1.cni.cncf.io/resourceName: bridge.network.kubevirt.io/br-vm
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "storage-net",
      "type": "cnv-bridge",
      "bridge": "br-vm",
      "ipam": {},
      "macspoofchk": true
    }
