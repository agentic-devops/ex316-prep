# VM that boots from the cloned DataVolume clone-root (apply 02 first).
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: cloned-vm
  namespace: clone-lab
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app: cloned-vm
    spec:
      domain:
        cpu:
          cores: 1
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
        resources:
          requests:
            memory: 2Gi
      networks:
        - name: default
          pod: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: rootdisk
          dataVolume:
            name: clone-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              user: cloud-user
              password: lab-pass-123
              chpasswd:
                expire: false
              ssh_pwauth: true
