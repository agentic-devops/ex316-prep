# Runs only on nodes labelled lab/dedicated=vm and tolerates the matching taint:
#   oc label node <node> lab/dedicated=vm
#   oc adm taint node <node> lab/dedicated=vm:NoSchedule
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: dedicated-vm
  namespace: fail-lab
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app: dedicated-vm
    spec:
      nodeSelector:
        lab/dedicated: vm
      tolerations:
        - key: lab/dedicated
          operator: Equal
          value: vm
          effect: NoSchedule
      domain:
        cpu:
          cores: 1
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
        resources:
          requests:
            memory: 2Gi
      networks:
        - name: default
          pod: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: rootdisk
          containerDisk:
            image: quay.io/containerdisks/fedora:latest
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              user: cloud-user
              password: lab-pass-123
              chpasswd:
                expire: false
              ssh_pwauth: true
