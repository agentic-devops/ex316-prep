# evictionStrategy LiveMigrate: on drain, migrate the VM; block the drain if it cannot.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: ha-live
  namespace: fail-lab
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app: ha-live
    spec:
      evictionStrategy: LiveMigrate
      domain:
        cpu:
          cores: 1
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
        resources:
          requests:
            memory: 2Gi
      networks:
        - name: default
          pod: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: rootdisk
          containerDisk:
            image: quay.io/containerdisks/fedora:latest
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              user: cloud-user
              password: lab-pass-123
              chpasswd:
                expire: false
              ssh_pwauth: true
---
# evictionStrategy None: on drain the VM is shut down, not migrated.
# Other values to know: LiveMigrateIfPossible (migrate if it can, else shut down) and External.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: ha-none
  namespace: fail-lab
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app: ha-none
    spec:
      evictionStrategy: None
      domain:
        cpu:
          cores: 1
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
        resources:
          requests:
            memory: 2Gi
      networks:
        - name: default
          pod: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: rootdisk
          containerDisk:
            image: quay.io/containerdisks/fedora:latest
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              user: cloud-user
              password: lab-pass-123
              chpasswd:
                expire: false
              ssh_pwauth: true
